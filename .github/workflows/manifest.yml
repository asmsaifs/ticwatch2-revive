name: Refresh manifest checksums

# Keeps manifest.tsv in sync with the APKs in apks/ so the installers always know the current checksums.
on:
  push:
    paths:
      - 'apks/**'
      - 'patches/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate manifest.tsv
        run: |
          # aapt2 (from the Android SDK on the runner) is only needed when a brand-new app is added
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ./tools/update-manifest.sh
      - name: Commit changes
        run: |
          if ! git diff --quiet -- manifest.tsv; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.tsv
            git commit -m "Refresh manifest checksums"
            git push
          fi
